<svg xmlns="http://www.w3.org/2000/svg" width="840" height="840" viewBox="92 92 840 840">
  <!-- prøvebilde: the disc from fjernsynSmall.svg alone, without the tile, and ringed, for the header -->
  <defs>
    <clipPath id="disc">
      <circle cx="512" cy="512" r="420"/>
    </clipPath>
  </defs>
  <g clip-path="url(#disc)">
    <rect x="92" y="92" width="140" height="290" fill="#e9c46a"/>
    <rect x="232" y="92" width="140" height="290" fill="#7fb7be"/>
    <rect x="372" y="92" width="140" height="290" fill="#6a994e"/>
    <rect x="512" y="92" width="140" height="290" fill="#b56576"/>
    <rect x="652" y="92" width="140" height="290" fill="#d1603d"/>
    <rect x="792" y="92" width="140" height="290" fill="#3d5a80"/>
    <rect x="92" y="380" width="840" height="280" fill="#141414"/>
    <rect x="92" y="660" width="280" height="272" fill="#2a2a2a"/>
    <rect x="372" y="660" width="280" height="272" fill="#8a8a8a"/>
    <rect x="652" y="660" width="280" height="272" fill="#ececec"/>
  </g>
  <!-- a thin ring, so the dark band does not run into a dark top bar -->
  <circle cx="512" cy="512" r="402" fill="none" stroke="#f3ece0" stroke-width="36"/>
  <path d="M442 432 L610 520 L442 608 Z" fill="#f3ece0" stroke="#f3ece0" stroke-width="34" stroke-linejoin="round"/>
